<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 역할 배정 | Premium</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    :root {
      --primary-color: #3182f6;
      --primary-grad: linear-gradient(135deg, #3182f6 0%, #5c4bde 100%);
      --bg-color: #f2f4f6;
      --surface: #ffffff;
      --text-main: #191f28;
      --text-sub: #8b95a1;
      --border: #e5e8eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 은은하게 움직이는 고급스러운 메쉬 그라데이션 배경 */
    body {
      background: linear-gradient(-45deg, #e0eafc, #cfdef3, #e8f3ff, #f2f4f6);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: var(--text-main);
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 메인 앱 컨테이너 */
    .container {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      border-radius: 32px;
      box-shadow: 0 24px 48px -12px rgba(49, 130, 246, 0.15), 0 4px 24px rgba(0, 0, 0, 0.04);
      padding: 40px 30px;
      position: relative;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 진행 바 (그라데이션 적용) */
    .progress-wrapper {
      width: 100%;
      background-color: var(--bg-color);
      height: 8px;
      border-radius: 8px;
      margin-bottom: 40px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary-grad);
      width: 0%;
      border-radius: 8px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 헤더 텍스트 */
    .header-text {
      margin-bottom: 36px;
    }

    .header-text h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      letter-spacing: -0.5px;
    }

    .header-text p {
      font-size: 16px;
      color: var(--text-sub);
      margin-top: 14px;
      line-height: 1.5;
      font-weight: 500;
    }

    /* 화면 전환 애니메이션 (Spring 효과) */
    .step {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .step.active {
      display: flex;
      animation: slideUpFade 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 입력 폼 디자인 */
    .form-group {
      margin-bottom: 24px;
      flex: 1;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 20px 24px;
      background-color: #f9fafb;
      border: 1.5px solid transparent;
      border-radius: 20px;
      font-size: 18px;
      color: var(--text-main);
      font-weight: 600;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #b0b8c1;
      font-weight: 500;
    }

    input:focus {
      outline: none;
      background-color: #ffffff;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.12);
    }

    .member-input-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 420px;
      overflow-y: auto;
      padding-bottom: 20px;
    }

    /* 특성 선택 칩 */
    .trait-card {
      margin-bottom: 40px;
    }

    .trait-card h4 {
      font-size: 19px;
      color: var(--text-main);
      margin-bottom: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trait-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .trait-option {
      background: #ffffff;
      border: 1.5px solid var(--border);
      color: #4e5968;
      padding: 14px 20px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .trait-option:active {
      transform: scale(0.94);
    }

    .trait-option.selected {
      background: #f0f5ff;
      border-color: var(--primary-color);
      color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(49, 130, 246, 0.15);
    }

    /* 하단 버튼 (그라데이션 및 네온 효과) */
    .bottom-btn-group {
      display: flex;
      gap: 14px;
      margin-top: auto;
      padding-top: 20px;
      background: linear-gradient(to top, rgba(255,255,255,1) 70%, rgba(255,255,255,0));
    }

    .btn {
      flex: 1;
      background: var(--primary-grad);
      color: white;
      border: none;
      padding: 20px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
      box-shadow: 0 8px 16px rgba(49, 130, 246, 0.2);
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 8px rgba(49, 130, 246, 0.15);
    }

    .btn-secondary {
      background: var(--bg-color);
      color: #4e5968;
      flex: 0.35;
      box-shadow: none;
    }

    .btn-secondary:active {
      background: #e5e8eb;
    }

    /* 소개 리스트 */
    .intro-list {
      list-style: none;
      margin-top: 20px;
    }

    .intro-list li {
      background: #f9fafb;
      padding: 18px;
      border-radius: 20px;
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .intro-list li:hover {
      background: #ffffff;
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(49, 130, 246, 0.08);
    }

    .intro-list li span {
      margin-right: 14px;
      font-size: 24px;
    }

    /* 결과 리스트 디자인 (프리미엄 카드) */
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
    }

    .result-item {
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.04);
      border-radius: 24px;
      padding: 24px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      opacity: 0;
      transform: translateY(20px);
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .result-emoji {
      font-size: 32px;
      background: var(--primary-grad);
      color: white;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(49, 130, 246, 0.2);
    }

    .result-content {
      flex: 1;
    }

    .result-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .result-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }

    .result-role {
      background: #f0f5ff;
      color: var(--primary-color);
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
    }

    .result-desc {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.6;
      font-weight: 500;
    }

    /* 스크롤바 숨기기 */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="progress-wrapper">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- STEP 0 -->
    <div class="step active" id="step0">
      <div class="header-text">
        <h1>조별 과제 역할,<br>이제 스마트하게 나눠요</h1>
        <p>팀원들의 장점만 고르면 겹치지 않게 배정해 드려요.</p>
      </div>
      
      <ul class="intro-list form-group">
        <li><span>✨</span> 꼭 필요한 핵심 역할 11가지 엄선</li>
        <li><span>🎯</span> 장점 중복 다중 선택 완벽 지원</li>
        <li><span>🤝</span> 절대 겹치지 않는 스마트 분배 시스템</li>
      </ul>

      <div class="bottom-btn-group">
        <button class="btn" onclick="goToStep(1)">시작하기</button>
      </div>
    </div>

    <!-- STEP 1 -->
    <div class="step" id="step1">
      <div class="header-text">
        <h1>팀원이 모두<br>몇 명인가요?</h1>
        <p>본인을 포함한 총 인원수를 적어주세요.</p>
      </div>
      <div class="form-group">
        <input type="number" id="memberCount" min="1" max="10" placeholder="숫자만 입력 (최대 10명)">
      </div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(0)">이전</button>
        <button class="btn" onclick="setupNames()">다음</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step" id="step2">
      <div class="header-text">
        <h1>팀원들의 이름을<br>알려주세요</h1>
      </div>
      <div class="form-group member-input-list" id="nameInputs"></div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(1)">이전</button>
        <button class="btn" onclick="setupTraits()">다음</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step" id="step3">
      <div class="header-text">
        <h1>각자에게 어울리는<br>장점을 모두 골라주세요</h1>
        <p>복수 선택이 가능해요. 해당하는 항목을 눌러주세요.</p>
      </div>
      <div class="form-group" id="traitSelectionList" style="overflow-y: auto;"></div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(2)">이전</button>
        <button class="btn" onclick="calculateRoles()">최적의 결과 보기</button>
      </div>
    </div>

    <!-- STEP 4 -->
    <div class="step" id="step4">
      <div class="header-text">
        <h1>역할 배정이<br>완료되었어요 🎉</h1>
        <p>이제 팀원들과 함께 프로젝트를 시작해 보세요!</p>
      </div>
      <div class="form-group result-list" id="resultList" style="overflow-y: auto;"></div>
      <div class="bottom-btn-group">
        <button class="btn" onclick="resetAll()">새로 배정하기</button>
      </div>
    </div>
  </div>

  <script>
    // 11가지 핵심 데이터
    const traitsData = [
      { id: 1, trait: "리더십이 뛰어남", role: "총괄 팀장", emoji: "👑", desc: "전반적인 진행 상황을 총괄하고 팀원들의 의견을 조율해요." },
      { id: 2, trait: "발표를 잘함", role: "메인 발표자", emoji: "🎤", desc: "완성된 결과물을 사람들 앞에서 전달력 있게 발표해요." },
      { id: 3, trait: "글씨·정리를 잘함", role: "기록 서기", emoji: "✍️", desc: "회의 내용과 흩어진 아이디어를 깔끔하게 문서로 정리해요." },
      { id: 4, trait: "PPT·디자인을 잘함", role: "자료 제작자", emoji: "💻", desc: "슬라이드 디자인과 시각 자료를 수준 높게 제작해요." },
      { id: 5, trait: "검색과 조사를 잘함", role: "자료 조사원", emoji: "🔍", desc: "주제와 관련된 신뢰성 있는 데이터를 빠르고 정확히 찾아내요." },
      { id: 6, trait: "창의력이 좋음", role: "기획 디렉터", emoji: "💡", desc: "남들과 다른 참신한 아이디어와 전체적인 방향성을 제시해요." },
      { id: 7, trait: "분위기를 잘 띄움", role: "분위기 메이커", emoji: "🎉", desc: "긍정적인 분위기 속에서 협력할 수 있도록 팀에 에너지를 줘요." },
      { id: 8, trait: "미적 감각이 있음", role: "비주얼 디자이너", emoji: "🎨", desc: "포스터, 표지 등 결과물의 시각적인 요소를 예쁘게 꾸며요." },
      { id: 9, trait: "꼼꼼하고 치밀함", role: "최종 검토관", emoji: "🧐", desc: "결과물의 오탈자나 논리적 오류를 꼼꼼하게 다듬고 마무리해요." },
      { id: 10, trait: "약속을 잘 지킴", role: "타임키퍼", emoji: "⏱️", desc: "단계별 시간을 체크하고 전체 일정이 지연되지 않게 관리해요." },
      { id: 11, trait: "돕는 걸 좋아함", role: "올라운더", emoji: "🤝", desc: "일손이 부족한 파트에 유연하게 들어가 작업을 든든하게 도와요." }
    ];

    let members = []; 

    function goToStep(stepNum) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(`step${stepNum}`).classList.add('active');
      
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = stepNum === 0 ? '0%' : (stepNum / 4 * 100) + '%';
    }

    function setupNames() {
      const countInput = document.getElementById('memberCount');
      const count = parseInt(countInput.value);

      if (!count || count < 1 || count > 10) {
        alert("1명에서 10명 사이의 숫자를 입력해 주세요.");
        return;
      }

      const nameInputsDiv = document.getElementById('nameInputs');
      nameInputsDiv.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        nameInputsDiv.innerHTML += `<input type="text" class="member-name-input" placeholder="팀원 ${i} 이름">`;
      }
      goToStep(2);
    }

    function setupTraits() {
      const nameInputs = document.querySelectorAll('.member-name-input');
      members = [];

      for (let i = 0; i < nameInputs.length; i++) {
        const name = nameInputs[i].value.trim();
        if (!name) {
          alert(`팀원 ${i + 1}의 이름을 입력해 주세요.`);
          return;
        }
        members.push({ name: name, selectedTraitIds: [] });
      }

      const traitSelectionDiv = document.getElementById('traitSelectionList');
      traitSelectionDiv.innerHTML = '';

      members.forEach((member, mIndex) => {
        let traitOptionsHTML = '';
        traitsData.forEach(t => {
          traitOptionsHTML += `
            <div class="trait-option" onclick="toggleTrait(${mIndex}, ${t.id}, this)">
              ${t.trait}
            </div>
          `;
        });

        traitSelectionDiv.innerHTML += `
          <div class="trait-card">
            <h4>👤 ${member.name}</h4>
            <div class="trait-grid">${traitOptionsHTML}</div>
          </div>
        `;
      });

      goToStep(3);
    }

    function toggleTrait(memberIndex, traitId, element) {
      const traitList = members[memberIndex].selectedTraitIds;
      const index = traitList.indexOf(traitId);

      if (index > -1) {
        traitList.splice(index, 1);
        element.classList.remove('selected');
      } else {
        traitList.push(traitId);
        element.classList.add('selected');
      }
    }

    function calculateRoles() {
      for (let i = 0; i < members.length; i++) {
        if (members[i].selectedTraitIds.length === 0) {
          alert(`${members[i].name}님의 장점을 1개 이상 골라주세요.`);
          return;
        }
      }

      const assignedRoleIds = new Set();
      const finalAssignments = [];
      const traitSelectionCounts = {};

      members.forEach(m => {
        m.selectedTraitIds.forEach(id => {
          traitSelectionCounts[id] = (traitSelectionCounts[id] || 0) + 1;
        });
      });

      members.forEach(member => {
        const sortedCandidateTraitIds = [...member.selectedTraitIds].sort((a, b) => {
          return traitSelectionCounts[a] - traitSelectionCounts[b];
        });

        let chosenTraitId = null;
        for (let tid of sortedCandidateTraitIds) {
          if (!assignedRoleIds.has(tid)) {
            chosenTraitId = tid;
            break;
          }
        }

        if (!chosenTraitId) {
          for (let t of traitsData) {
            if (!assignedRoleIds.has(t.id)) {
              chosenTraitId = t.id;
              break;
            }
          }
        }

        assignedRoleIds.add(chosenTraitId);
        const traitInfo = traitsData.find(t => t.id === chosenTraitId);

        finalAssignments.push({
          name: member.name,
          role: traitInfo.role,
          desc: traitInfo.desc,
          emoji: traitInfo.emoji
        });
      });

      const resultDiv = document.getElementById('resultList');
      resultDiv.innerHTML = '';

      // 순차적으로 등장하는(Staggered) 애니메이션 적용
      finalAssignments.forEach((item, index) => {
        const delay = index * 0.15; // 0.15초 간격으로 카드 등장
        resultDiv.innerHTML += `
          <div class="result-item" style="animation-delay: ${delay}s;">
            <div class="result-emoji">${item.emoji}</div>
            <div class="result-content">
              <div class="result-header">
                <span class="result-name">${item.name}</span>
                <span class="result-role">${item.role}</span>
              </div>
              <div class="result-desc">${item.desc}</div>
            </div>
          </div>
        `;
      });

      goToStep(4);
    }

    function resetAll() {
      document.getElementById('memberCount').value = '';
      members = [];
      goToStep(0);
    }
  </script>
</body>
</html>

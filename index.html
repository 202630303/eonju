<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 역할 배정</title>
  <style>
    /* 폰트 및 기본화 설정 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #f2f4f6; /* 토스 특유의 라이트 그레이 배경 */
      color: #333d4b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 모바일 앱 화면 비율의 컨테이너 */
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 420px; /* 스마트폰 앱처럼 좁고 길게 */
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      padding: 30px 24px;
      position: relative;
      min-height: 600px;
      display: flex;
      flex-direction: column;
    }

    /* 프로그래스 바 */
    .progress-bar-container {
      width: 100%;
      background-color: #f2f4f6;
      height: 4px;
      border-radius: 4px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: #3182f6; /* 토스 블루 */
      width: 0%;
      transition: width 0.4s ease;
    }

    /* 토스 스타일의 좌측 정렬 헤더 */
    .header-text {
      margin-bottom: 30px;
    }

    .header-text h1 {
      font-size: 24px;
      font-weight: 700;
      color: #191f28;
      line-height: 1.4;
      white-space: pre-line;
    }

    .header-text p {
      font-size: 15px;
      color: #8b95a1;
      margin-top: 10px;
      line-height: 1.5;
    }

    .step {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .step.active {
      display: flex;
      animation: fadeUp 0.4s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 입력창 디자인 */
    .form-group {
      margin-bottom: 24px;
      flex: 1;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #4e5968;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 18px 16px;
      background-color: #f2f4f6;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      color: #191f28;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    input::placeholder {
      color: #b0b8c1;
    }

    input:focus {
      outline: none;
      background-color: #e8f3ff;
      box-shadow: inset 0 0 0 1px #3182f6;
    }

    .member-input-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    /* 특성 선택 칩(Chip) 디자인 */
    .trait-card {
      margin-bottom: 30px;
    }

    .trait-card h4 {
      font-size: 17px;
      color: #191f28;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .trait-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .trait-option {
      background: #f2f4f6;
      color: #4e5968;
      padding: 10px 16px;
      border-radius: 20px; /* 둥근 알약 형태 */
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .trait-option.selected {
      background-color: #e8f3ff;
      color: #3182f6;
      font-weight: 600;
    }

    /* 하단 버튼 영역 (항상 아래로 붙게) */
    .bottom-btn-group {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding-top: 20px;
    }

    .btn {
      flex: 1;
      background-color: #3182f6;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }

    .btn:active {
      background-color: #1b64da;
    }

    .btn-secondary {
      background-color: #f2f4f6;
      color: #4e5968;
      flex: 0.4; /* 이전 버튼은 조금 작게 */
    }

    .btn-secondary:active {
      background-color: #e5e8eb;
    }

    /* 소개 리스트 */
    .intro-list {
      list-style: none;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    .intro-list li {
      font-size: 15px;
      color: #4e5968;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      line-height: 1.5;
    }

    .intro-list li span {
      margin-right: 12px;
      font-size: 18px;
    }

    /* 결과 리스트 디자인 */
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }

    .result-item {
      background: #f9fafb;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-name {
      font-size: 18px;
      font-weight: 700;
      color: #191f28;
    }

    .result-role {
      background: #e8f3ff;
      color: #3182f6;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .result-desc {
      font-size: 14px;
      color: #6b7684;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 프로그래스 바 -->
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- STEP 0: 안내 페이지 -->
    <div class="step active" id="step0">
      <div class="header-text">
        <h1>팀원들의 역할을<br>스마트하게 나눠볼까요?</h1>
        <p>각자의 장점을 살려 겹치지 않게 배정해 드려요.</p>
      </div>
      
      <ul class="intro-list form-group">
        <li><span>✨</span> 장점에 맞는 맞춤형 역할 분담</li>
        <li><span>🎯</span> 해당하는 특성을 여러 개 중복 선택 가능</li>
        <li><span>🔒</span> 역할이 겹치지 않는 스마트 분배 알고리즘</li>
      </ul>

      <div class="bottom-btn-group">
        <button class="btn" onclick="goToStep(1)">시작하기</button>
      </div>
    </div>

    <!-- STEP 1: 인원수 입력 -->
    <div class="step" id="step1">
      <div class="header-text">
        <h1>모둠원이<br>모두 몇 명인가요?</h1>
      </div>
      <div class="form-group">
        <input type="number" id="memberCount" min="1" max="10" placeholder="숫자 입력 (예: 4)">
      </div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(0)">이전</button>
        <button class="btn" onclick="setupNames()">다음</button>
      </div>
    </div>

    <!-- STEP 2: 이름 입력 -->
    <div class="step" id="step2">
      <div class="header-text">
        <h1>모둠원의 이름을<br>알려주세요</h1>
      </div>
      <div class="form-group member-input-list" id="nameInputs">
        <!-- JS로 동적 생성 -->
      </div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(1)">이전</button>
        <button class="btn" onclick="setupTraits()">다음</button>
      </div>
    </div>

    <!-- STEP 3: 특성 선택 -->
    <div class="step" id="step3">
      <div class="header-text">
        <h1>각자에게 어울리는<br>장점을 모두 골라주세요</h1>
        <p>복수 선택이 가능해요.</p>
      </div>
      <div class="form-group" id="traitSelectionList" style="overflow-y: auto;">
        <!-- JS로 동적 생성 -->
      </div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(2)">이전</button>
        <button class="btn" onclick="calculateRoles()">결과 보기</button>
      </div>
    </div>

    <!-- STEP 4: 결과 확인 -->
    <div class="step" id="step4">
      <div class="header-text">
        <h1>역할 배정이<br>완료되었어요 🎉</h1>
      </div>
      <div class="form-group result-list" id="resultList" style="overflow-y: auto;">
        <!-- JS로 동적 생성 -->
      </div>
      <div class="bottom-btn-group">
        <button class="btn" onclick="resetAll()">새로 배정하기</button>
      </div>
    </div>
  </div>

  <script>
    // 22가지 특성 및 역할 매핑 DB (기존과 동일)
    const traitsData = [
      { id: 1, trait: "리더십이 뛰어남", role: "총괄 팀장", desc: "진행 상황을 총괄하고 팀원들의 의견을 모아요." },
      { id: 2, trait: "발표를 잘함", role: "메인 발표자", desc: "완성된 결과물을 사람들 앞에서 전달력 있게 발표해요." },
      { id: 3, trait: "글씨/정리를 잘함", role: "기록 서기", desc: "회의 내용과 아이디어를 깔끔하게 문서로 기록해요." },
      { id: 4, trait: "PPT를 잘 다룸", role: "자료 제작자", desc: "슬라이드 디자인과 시각 자료를 수준 높게 제작해요." },
      { id: 5, trait: "검색을 잘함", role: "자료 조사원", desc: "주제와 관련된 신뢰성 있는 데이터를 정확히 찾아요." },
      { id: 6, trait: "시간 관리를 잘함", role: "타임키퍼", desc: "단계별 시간을 체크하고 일정이 지연되지 않게 관리해요." },
      { id: 7, trait: "창의력이 좋음", role: "기획 디렉터", desc: "참신한 아이디어와 핵심 방향성을 제시해요." },
      { id: 8, trait: "꼼꼼하고 치밀함", role: "최종 검토관", desc: "결과물의 오탈자나 오류를 꼼꼼하게 다듬어요." },
      { id: 9, trait: "분위기를 잘 띄움", role: "분위기 매니저", desc: "긍정적인 분위기 속에서 협력할 수 있도록 도와요." },
      { id: 10, trait: "디자인 감각이 있음", role: "비주얼 디자이너", desc: "포스터, 표지 등 시각적인 요소를 예쁘게 꾸며요." },
      { id: 11, trait: "경청하고 배려함", role: "의견 중재자", desc: "의견 대립이 있을 때 부드럽게 타협점을 찾아요." },
      { id: 12, trait: "손재주가 좋음", role: "실물 제작자", desc: "실제 모형이나 오프라인 결과물을 훌륭하게 만들어요." },
      { id: 13, trait: "분석력이 뛰어남", role: "논리 분석관", desc: "자료들의 연관성을 논리적으로 파악해 결론을 내요." },
      { id: 14, trait: "말에 설득력이 있음", role: "Q&A 담당", desc: "발표 후 이어질 날카로운 질문에 논리적으로 답변해요." },
      { id: 15, trait: "책임감이 강함", role: "프로젝트 매니저", desc: "팀의 규칙 준수를 이끌고 맡은 작업을 끝까지 책임져요." },
      { id: 16, trait: "상황 판단이 빠름", role: "위기관리자", desc: "문제 발생 시 빠르고 적절한 해결책을 찾아내요." },
      { id: 17, trait: "외국어를 잘함", role: "해외자료 탐색", desc: "해외 사이트나 외국 자료 등 폭넓은 정보를 수집해요." },
      { id: 18, trait: "영상 편집을 잘함", role: "미디어 에디터", desc: "영상 촬영이나 자막 입력 등 미디어 콘텐츠를 제작해요." },
      { id: 19, trait: "도와주는 걸 좋아함", role: "올라운더", desc: "일손이 부족한 파트에 유연하게 들어가 작업을 도와요." },
      { id: 20, trait: "계산이 빠르고 정확함", role: "예산 관리원", desc: "활동에 필요한 준비물과 예산, 비용을 꼼꼼히 관리해요." },
      { id: 21, trait: "핵심 요약을 잘함", role: "개요 요약가", desc: "방대한 조사 자료에서 중요한 포인트만 빠르게 추출해요." },
      { id: 22, trait: "호기심이 많음", role: "피드백 전문가", desc: "결과물의 허점을 미리 찾아내어 발전적 피드백을 줘요." }
    ];

    let members = []; 

    function goToStep(stepNum) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(`step${stepNum}`).classList.add('active');
      
      const progressBar = document.getElementById('progressBar');
      // 시작페이지(0)는 0%, 마지막페이지(4)는 100%
      progressBar.style.width = stepNum === 0 ? '0%' : (stepNum / 4 * 100) + '%';
    }

    function setupNames() {
      const countInput = document.getElementById('memberCount');
      const count = parseInt(countInput.value);

      if (!count || count < 1 || count > 10) {
        alert("1명에서 10명 사이의 숫자를 입력해주세요.");
        return;
      }

      const nameInputsDiv = document.getElementById('nameInputs');
      nameInputsDiv.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        nameInputsDiv.innerHTML += `
          <input type="text" class="member-name-input" placeholder="팀원 ${i} 이름">
        `;
      }
      goToStep(2);
    }

    function setupTraits() {
      const nameInputs = document.querySelectorAll('.member-name-input');
      members = [];

      for (let i = 0; i < nameInputs.length; i++) {
        const name = nameInputs[i].value.trim();
        if (!name) {
          alert(`팀원 ${i + 1}의 이름을 입력해주세요.`);
          return;
        }
        members.push({ name: name, selectedTraitIds: [] });
      }

      const traitSelectionDiv = document.getElementById('traitSelectionList');
      traitSelectionDiv.innerHTML = '';

      members.forEach((member, mIndex) => {
        let traitOptionsHTML = '';
        traitsData.forEach(t => {
          traitOptionsHTML += `
            <div class="trait-option" onclick="toggleTrait(${mIndex}, ${t.id}, this)">
              ${t.trait}
            </div>
          `;
        });

        traitSelectionDiv.innerHTML += `
          <div class="trait-card">
            <h4>${member.name}</h4>
            <div class="trait-grid">
              ${traitOptionsHTML}
            </div>
          </div>
        `;
      });

      goToStep(3);
    }

    function toggleTrait(memberIndex, traitId, element) {
      const traitList = members[memberIndex].selectedTraitIds;
      const index = traitList.indexOf(traitId);

      if (index > -1) {
        traitList.splice(index, 1);
        element.classList.remove('selected');
      } else {
        traitList.push(traitId);
        element.classList.add('selected');
      }
    }

    function calculateRoles() {
      for (let i = 0; i < members.length; i++) {
        if (members[i].selectedTraitIds.length === 0) {
          alert(`${members[i].name}님의 장점을 1개 이상 선택해주세요.`);
          return;
        }
      }

      const assignedRoleIds = new Set();
      const finalAssignments = [];
      const traitSelectionCounts = {};

      members.forEach(m => {
        m.selectedTraitIds.forEach(id => {
          traitSelectionCounts[id] = (traitSelectionCounts[id] || 0) + 1;
        });
      });

      members.forEach(member => {
        const sortedCandidateTraitIds = [...member.selectedTraitIds].sort((a, b) => {
          return traitSelectionCounts[a] - traitSelectionCounts[b];
        });

        let chosenTraitId = null;

        for (let tid of sortedCandidateTraitIds) {
          if (!assignedRoleIds.has(tid)) {
            chosenTraitId = tid;
            break;
          }
        }

        if (!chosenTraitId) {
          for (let t of traitsData) {
            if (!assignedRoleIds.has(t.id)) {
              chosenTraitId = t.id;
              break;
            }
          }
        }

        assignedRoleIds.add(chosenTraitId);
        const traitInfo = traitsData.find(t => t.id === chosenTraitId);

        finalAssignments.push({
          name: member.name,
          role: traitInfo.role,
          desc: traitInfo.desc,
        });
      });

      const resultDiv = document.getElementById('resultList');
      resultDiv.innerHTML = '';

      finalAssignments.forEach(item => {
        resultDiv.innerHTML += `
          <div class="result-item">
            <div class="result-header">
              <span class="result-name">${item.name}</span>
              <span class="result-role">${item.role}</span>
            </div>
            <div class="result-desc">
              ${item.desc}
            </div>
          </div>
        `;
      });

      goToStep(4);
    }

    function resetAll() {
      document.getElementById('memberCount').value = '';
      members = [];
      goToStep(0);
    }
  </script>
</body>
</html>

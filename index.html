<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 역할 배정</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #F2F4F6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #333D4B;
    }

    /* 메인 앱 컨테이너 */
    .container {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 40px 28px;
      position: relative;
      min-height: 640px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 진행 바 */
    .progress-wrapper {
      width: 100%;
      background-color: #F2F4F6;
      height: 6px;
      border-radius: 6px;
      margin-bottom: 36px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: #3182F6;
      width: 0%;
      border-radius: 6px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 헤더 텍스트 */
    .header-text {
      margin-bottom: 32px;
    }

    .header-text h1 {
      font-size: 26px;
      font-weight: 700;
      color: #191F28;
      line-height: 1.35;
      letter-spacing: -0.5px;
    }

    .header-text p {
      font-size: 16px;
      color: #8B95A1;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* 화면 전환 애니메이션 */
    .step {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .step.active {
      display: flex;
      animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 입력 폼 */
    .form-group {
      margin-bottom: 24px;
      flex: 1;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 18px 20px;
      background-color: #F9FAFB;
      border: 1px solid #E5E8EB;
      border-radius: 16px;
      font-size: 17px;
      color: #191F28;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #B0B8C1;
    }

    input:focus {
      outline: none;
      background-color: #FFFFFF;
      border-color: #3182F6;
      box-shadow: 0 0 0 4px rgba(49, 130, 246, 0.1);
    }

    .member-input-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding-bottom: 10px;
    }

    /* 특성 선택 칩(Chip) */
    .trait-card {
      margin-bottom: 36px;
    }

    .trait-card h4 {
      font-size: 18px;
      color: #191F28;
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trait-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .trait-option {
      background: #F9FAFB;
      border: 1px solid #E5E8EB;
      color: #4E5968;
      padding: 12px 18px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .trait-option:active {
      transform: scale(0.96);
    }

    .trait-option.selected {
      background-color: #E8F3FF;
      border-color: #3182F6;
      color: #3182F6;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(49, 130, 246, 0.15);
    }

    /* 하단 버튼 */
    .bottom-btn-group {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding-top: 20px;
    }

    .btn {
      flex: 1;
      background-color: #3182F6;
      color: white;
      border: none;
      padding: 18px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
      background-color: #1B64DA;
    }

    .btn-secondary {
      background-color: #F2F4F6;
      color: #4E5968;
      flex: 0.35;
    }

    .btn-secondary:active {
      background-color: #E5E8EB;
    }

    /* 소개 리스트 */
    .intro-list {
      list-style: none;
      margin-top: 20px;
    }

    .intro-list li {
      background: #F9FAFB;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      color: #333D4B;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      font-weight: 500;
    }

    .intro-list li span {
      margin-right: 12px;
      font-size: 20px;
    }

    /* 결과 리스트 디자인 */
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
    }

    .result-item {
      background: #FFFFFF;
      border: 1px solid #E5E8EB;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.03);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: transform 0.2s ease;
    }

    .result-item:hover {
      transform: translateY(-2px);
    }

    .result-emoji {
      font-size: 32px;
      background: #F2F4F6;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
    }

    .result-content {
      flex: 1;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .result-name {
      font-size: 18px;
      font-weight: 700;
      color: #191F28;
    }

    .result-role {
      background: #E8F3FF;
      color: #3182F6;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
    }

    .result-desc {
      font-size: 14px;
      color: #6B7684;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="progress-wrapper">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- STEP 0: 인트로 -->
    <div class="step active" id="step0">
      <div class="header-text">
        <h1>조별 과제 역할,<br>이제 스마트하게 나눠요</h1>
        <p>각자의 장점만 고르면 겹치지 않게 배정해 드려요.</p>
      </div>
      
      <ul class="intro-list form-group">
        <li><span>💡</span> 가장 중요한 핵심 역할 11가지 엄선</li>
        <li><span>🎯</span> 나에게 맞는 장점 복수 선택 가능</li>
        <li><span>🤝</span> 절대 겹치지 않는 스마트 분배 시스템</li>
      </ul>

      <div class="bottom-btn-group">
        <button class="btn" onclick="goToStep(1)">시작하기</button>
      </div>
    </div>

    <!-- STEP 1: 인원수 입력 -->
    <div class="step" id="step1">
      <div class="header-text">
        <h1>팀원이 모두<br>몇 명인가요?</h1>
      </div>
      <div class="form-group">
        <input type="number" id="memberCount" min="1" max="10" placeholder="숫자만 입력 (최대 10명)">
      </div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(0)">이전</button>
        <button class="btn" onclick="setupNames()">다음</button>
      </div>
    </div>

    <!-- STEP 2: 이름 입력 -->
    <div class="step" id="step2">
      <div class="header-text">
        <h1>팀원들의 이름을<br>알려주세요</h1>
      </div>
      <div class="form-group member-input-list" id="nameInputs"></div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(1)">이전</button>
        <button class="btn" onclick="setupTraits()">다음</button>
      </div>
    </div>

    <!-- STEP 3: 특성 선택 -->
    <div class="step" id="step3">
      <div class="header-text">
        <h1>각자에게 어울리는<br>장점을 모두 골라주세요</h1>
        <p>해당하는 항목을 자유롭게 눌러주세요.</p>
      </div>
      <div class="form-group" id="traitSelectionList" style="overflow-y: auto; padding-right: 5px;"></div>
      <div class="bottom-btn-group">
        <button class="btn btn-secondary" onclick="goToStep(2)">이전</button>
        <button class="btn" onclick="calculateRoles()">결과 보기</button>
      </div>
    </div>

    <!-- STEP 4: 결과 확인 -->
    <div class="step" id="step4">
      <div class="header-text">
        <h1>역할 배정이<br>완료되었어요 🎉</h1>
        <p>팀원들과 결과를 공유해 보세요.</p>
      </div>
      <div class="form-group result-list" id="resultList" style="overflow-y: auto; padding-right: 5px;"></div>
      <div class="bottom-btn-group">
        <button class="btn" onclick="resetAll()">새로 배정하기</button>
      </div>
    </div>
  </div>

  <script>
    // 핵심 역할 11가지 압축 데이터 (이모지 추가)
    const traitsData = [
      { id: 1, trait: "리더십이 뛰어남", role: "총괄 팀장", emoji: "👑", desc: "전반적인 진행 상황을 총괄하고 팀원들의 의견을 조율해요." },
      { id: 2, trait: "발표를 잘함", role: "메인 발표자", emoji: "🎤", desc: "완성된 결과물을 사람들 앞에서 전달력 있게 발표해요." },
      { id: 3, trait: "글씨·정리를 잘함", role: "기록 서기", emoji: "✍️", desc: "회의 내용과 흩어진 아이디어를 깔끔하게 문서로 정리해요." },
      { id: 4, trait: "PPT·컴퓨터를 잘 다룸", role: "자료 제작자", emoji: "💻", desc: "슬라이드 디자인과 시각 자료를 수준 높게 제작해요." },
      { id: 5, trait: "검색과 조사를 잘함", role: "자료 조사원", emoji: "🔍", desc: "주제와 관련된 신뢰성 있는 데이터를 빠르고 정확히 찾아내요." },
      { id: 6, trait: "창의력이 좋음", role: "기획 디렉터", emoji: "💡", desc: "남들과 다른 참신한 아이디어와 전체적인 방향성을 제시해요." },
      { id: 7, trait: "분위기를 잘 띄움", role: "분위기 메이커", emoji: "🎉", desc: "긍정적인 분위기 속에서 협력할 수 있도록 팀에 에너지를 줘요." },
      { id: 8, trait: "디자인 감각이 있음", role: "비주얼 디자이너", emoji: "🎨", desc: "포스터, 표지 등 결과물의 시각적인 요소를 예쁘게 꾸며요." },
      { id: 9, trait: "꼼꼼하고 치밀함", role: "최종 검토관", emoji: "🧐", desc: "결과물의 오탈자나 논리적 오류를 꼼꼼하게 다듬고 마무리해요." },
      { id: 10, trait: "시간 약속을 잘 지킴", role: "타임키퍼", emoji: "⏱️", desc: "단계별 시간을 체크하고 전체 일정이 지연되지 않게 관리해요." },
      { id: 11, trait: "도와주는 걸 좋아함", role: "올라운더", emoji: "🤝", desc: "일손이 부족한 파트에 유연하게 들어가 작업을 든든하게 도와요." }
    ];

    let members = []; 

    function goToStep(stepNum) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(`step${stepNum}`).classList.add('active');
      
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = stepNum === 0 ? '0%' : (stepNum / 4 * 100) + '%';
    }

    function setupNames() {
      const countInput = document.getElementById('memberCount');
      const count = parseInt(countInput.value);

      if (!count || count < 1 || count > 10) {
        alert("1명에서 10명 사이의 숫자를 입력해 주세요.");
        return;
      }

      const nameInputsDiv = document.getElementById('nameInputs');
      nameInputsDiv.innerHTML = '';

      for (let i = 1; i <= count; i++) {
        nameInputsDiv.innerHTML += `<input type="text" class="member-name-input" placeholder="팀원 ${i} 이름">`;
      }
      goToStep(2);
    }

    function setupTraits() {
      const nameInputs = document.querySelectorAll('.member-name-input');
      members = [];

      for (let i = 0; i < nameInputs.length; i++) {
        const name = nameInputs[i].value.trim();
        if (!name) {
          alert(`팀원 ${i + 1}의 이름을 입력해 주세요.`);
          return;
        }
        members.push({ name: name, selectedTraitIds: [] });
      }

      const traitSelectionDiv = document.getElementById('traitSelectionList');
      traitSelectionDiv.innerHTML = '';

      members.forEach((member, mIndex) => {
        let traitOptionsHTML = '';
        traitsData.forEach(t => {
          traitOptionsHTML += `
            <div class="trait-option" onclick="toggleTrait(${mIndex}, ${t.id}, this)">
              ${t.trait}
            </div>
          `;
        });

        traitSelectionDiv.innerHTML += `
          <div class="trait-card">
            <h4>👤 ${member.name}</h4>
            <div class="trait-grid">${traitOptionsHTML}</div>
          </div>
        `;
      });

      goToStep(3);
    }

    function toggleTrait(memberIndex, traitId, element) {
      const traitList = members[memberIndex].selectedTraitIds;
      const index = traitList.indexOf(traitId);

      if (index > -1) {
        traitList.splice(index, 1);
        element.classList.remove('selected');
      } else {
        traitList.push(traitId);
        element.classList.add('selected');
      }
    }

    function calculateRoles() {
      for (let i = 0; i < members.length; i++) {
        if (members[i].selectedTraitIds.length === 0) {
          alert(`${members[i].name}님의 장점을 1개 이상 골라주세요.`);
          return;
        }
      }

      const assignedRoleIds = new Set();
      const finalAssignments = [];
      const traitSelectionCounts = {};

      // 선택 빈도수 계산
      members.forEach(m => {
        m.selectedTraitIds.forEach(id => {
          traitSelectionCounts[id] = (traitSelectionCounts[id] || 0) + 1;
        });
      });

      members.forEach(member => {
        // 남들이 적게 고른 특성(희소성 높은 것)부터 우선순위 배정
        const sortedCandidateTraitIds = [...member.selectedTraitIds].sort((a, b) => {
          return traitSelectionCounts[a] - traitSelectionCounts[b];
        });

        let chosenTraitId = null;
        for (let tid of sortedCandidateTraitIds) {
          if (!assignedRoleIds.has(tid)) {
            chosenTraitId = tid;
            break;
          }
        }

        // 선택한 게 다 겹쳤다면, 남은 역할 중 아무거나 1개 배정
        if (!chosenTraitId) {
          for (let t of traitsData) {
            if (!assignedRoleIds.has(t.id)) {
              chosenTraitId = t.id;
              break;
            }
          }
        }

        assignedRoleIds.add(chosenTraitId);
        const traitInfo = traitsData.find(t => t.id === chosenTraitId);

        finalAssignments.push({
          name: member.name,
          role: traitInfo.role,
          desc: traitInfo.desc,
          emoji: traitInfo.emoji
        });
      });

      const resultDiv = document.getElementById('resultList');
      resultDiv.innerHTML = '';

      finalAssignments.forEach(item => {
        resultDiv.innerHTML += `
          <div class="result-item">
            <div class="result-emoji">${item.emoji}</div>
            <div class="result-content">
              <div class="result-header">
                <span class="result-name">${item.name}</span>
                <span class="result-role">${item.role}</span>
              </div>
              <div class="result-desc">${item.desc}</div>
            </div>
          </div>
        `;
      });

      goToStep(4);
    }

    function resetAll() {
      document.getElementById('memberCount').value = '';
      members = [];
      goToStep(0);
    }
  </script>
</body>
</html>
